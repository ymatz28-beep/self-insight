<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Insight — 手嶋静</title>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Space+Mono:ital@0;1&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #0a0a0a;
            color: #f0ede7;
            font-family: 'Noto Serif JP', serif;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }

        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 60px;
            padding-bottom: 40px;
            border-bottom: 1px solid #3a3a3a;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav .left {
            flex: 1;
        }

        nav .right {
            text-align: right;
        }

        /* Name Section */
        .name-section {
            padding: 120px 0;
            text-align: center;
        }

        .name-section h1 {
            font-family: 'IM Fell English', serif;
            font-size: 72px;
            font-style: italic;
            line-height: 1.2;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .name-divider {
            height: 1px;
            background-color: #3a3a3a;
            width: 60px;
            margin: 0 auto;
        }

        /* Score Section */
        .score-section {
            padding: 120px 0;
            text-align: center;
        }

        .score-number {
            font-family: 'Space Mono', monospace;
            font-size: 160px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -3px;
        }

        .score-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f0ede7;
        }

        /* Reading Section */
        .divider-line {
            height: 1px;
            background-color: #3a3a3a;
            margin: 80px 0;
        }

        .reading-section {
            text-align: center;
            padding: 0;
            margin: 0 0 80px 0;
        }

        .reading-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 16px;
            font-style: italic;
            line-height: 2.2;
            color: #f0ede7;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Domain Section */
        .domain-section {
            padding: 80px 0;
        }

        .domain-heading {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 60px;
            color: #f0ede7;
        }

        .domain-table {
            width: 100%;
            border-collapse: collapse;
        }

        .domain-row {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
        }

        .domain-score {
            font-family: 'Space Mono', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #c9a84c;
            width: 40px;
            text-align: right;
            flex-shrink: 0;
        }

        .domain-name {
            font-family: 'Noto Serif JP', serif;
            font-size: 14px;
            width: 80px;
            flex-shrink: 0;
        }

        .domain-bar-container {
            flex: 1;
            height: 1px;
            background-color: #2a2a2a;
            position: relative;
        }

        .domain-bar {
            height: 1px;
            background-color: #c9a84c;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Archetype Section */
        .archetype-section {
            padding: 80px 0;
        }

        .archetype-heading {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 60px;
            color: #f0ede7;
        }

        .archetype-block {
            margin-bottom: 80px;
            text-align: center;
        }

        .archetype-label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 16px;
        }

        .archetype-name {
            font-family: 'IM Fell English', serif;
            font-size: 48px;
            font-style: italic;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .archetype-description {
            font-family: 'Noto Serif JP', serif;
            font-size: 14px;
            line-height: 1.8;
            color: #d0ccc6;
        }

        /* Footer */
        footer {
            padding: 80px 0 40px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .name-section h1 {
                font-size: 48px;
            }

            .score-number {
                font-size: 100px;
            }

            .domain-row {
                gap: 16px;
            }

            .archetype-name {
                font-size: 32px;
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav .left, nav .right {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main>
        <!-- Navigation -->
        <nav>
            <div class="left">SELF INSIGHT</div>
            <div class="right">2026年5月</div>
        </nav>

        <!-- Name Section -->
        <section class="name-section">
            <h1>手嶋静</h1>
            <div class="name-divider"></div>
        </section>

        <!-- Score Section -->
        <section class="score-section">
            <div class="score-number">84</div>
            <div class="score-label">FORTUNE INDEX / 2026年5月</div>
        </section>

        <!-- Reading Section -->
        <div class="divider-line"></div>
        <section class="reading-section">
            <p class="reading-text">この月、あなたの直感は最高潮に達している。新たな扉が静かに開く時。信じるべきは、論理ではなく、内側から響く声。</p>
        </section>

        <!-- Domain Section -->
        <section class="domain-section">
            <h2 class="domain-heading">六領域</h2>

            <div class="domain-row">
                <div class="domain-score">78</div>
                <div class="domain-name">仕事</div>
                <div class="domain-bar-container">
                    <div class="domain-bar" style="width: 78%;"></div>
                </div>
            </div>

            <div class="domain-row">
                <div class="domain-score">82</div>
                <div class="domain-name">恋愛</div>
                <div class="domain-bar-container">
                    <div class="domain-bar" style="width: 82%;"></div>
                </div>
            </div>

            <div class="domain-row">
                <div class="domain-score">65</div>
                <div class="domain-name">財運</div>
                <div class="domain-bar-container">
                    <div class="domain-bar" style="width: 65%;"></div>
                </div>
            </div>

            <div class="domain-row">
                <div class="domain-score">88</div>
                <div class="domain-name">健康</div>
                <div class="domain-bar-container">
                    <div class="domain-bar" style="width: 88%;"></div>
                </div>
            </div>

            <div class="domain-row">
                <div class="domain-score">71</div>
                <div class="domain-name">家庭</div>
                <div class="domain-bar-container">
                    <div class="domain-bar" style="width: 71%;"></div>
                </div>
            </div>

            <div class="domain-row">
                <div class="domain-score">85</div>
                <div class="domain-name">精神</div>
                <div class="domain-bar-container">
                    <div class="domain-bar" style="width: 85%;"></div>
                </div>
            </div>
        </section>

        <!-- Divider -->
        <div class="divider-line"></div>

        <!-- Archetype Section -->
        <section class="archetype-section">
            <h2 class="archetype-heading">アーキタイプ</h2>

            <div class="archetype-block">
                <div class="archetype-label">過去</div>
                <div class="archetype-name">The Seeker</div>
                <div class="archetype-description">変化を求めた時代</div>
            </div>

            <div class="archetype-block">
                <div class="archetype-label">現在</div>
                <div class="archetype-name">The Builder</div>
                <div class="archetype-description">基盤を築く</div>
            </div>

            <div class="archetype-block">
                <div class="archetype-label">未来</div>
                <div class="archetype-name">The Ascendant</div>
                <div class="archetype-description">光へ向かう</div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            Self Insight · 2026
        </footer>
    </main>
</body>
</html>
