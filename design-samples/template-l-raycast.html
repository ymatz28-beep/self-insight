<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self Insight — 手嶋静</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0D0B14;
      --surface: #1A1626;
      --surface2: #251E36;
      --border: #2E2545;
      --gold: #C9A84C;
      --accent: #8B5CF6;
      --accent-warm: #A78BFA;
      --accent-teal: #14b8a6;
      --text-primary: #F5F0E8;
      --text-secondary: #A89EC0;
      --text-muted: #6B6285;
      --female-tint: #f5eff2;
    }

    html {
      font-family: "Inter", "Noto Sans JP", sans-serif;
      font-feature-settings: "ss03";
      background: var(--bg);
      color: var(--text-primary);
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* Hero stripe */
    .hero-stripe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-warm) 100%);
      z-index: 100;
    }

    /* Main container */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
      padding-top: 48px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .header-name {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      text-align: center;
    }

    .header-date {
      font-size: 12px;
      padding: 4px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
    }

    /* Search bar aesthetic */
    .search-aesthetic {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-aesthetic::before {
      content: "🔍";
      font-size: 12px;
      opacity: 0.5;
    }

    /* Section header */
    .section-header {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 32px;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 2px solid var(--accent);
    }

    /* Four pillars section */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .pillar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .pillar-label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .pillar-chars {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      font-family: "Noto Sans JP", sans-serif;
    }

    .pillar-role {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Five elements section */
    .five-elements {
      margin-bottom: 24px;
    }

    .element-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .element-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 40px;
    }

    .element-bar-container {
      flex: 1;
      height: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .element-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .element-bar.deficient {
      background: var(--accent-teal);
    }

    .element-bar.fire {
      background: #ef4444;
    }

    .element-percent {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 35px;
      text-align: right;
    }

    .deficient-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      background: var(--accent-teal);
      color: var(--bg);
      border-radius: 3px;
      margin-left: 8px;
    }

    /* Domain hexagons */
    .domains-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .domain-tile {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .domain-score {
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .domain-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    /* Annual chart section */
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .chart-wrapper {
      position: relative;
      height: 300px;
    }

    /* Monthly section */
    .monthly-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .monthly-score {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .monthly-number {
      font-size: 48px;
      font-weight: 700;
      color: var(--accent);
    }

    .monthly-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .monthly-description {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      font-family: "Noto Sans JP", sans-serif;
    }

    /* Blueprint advice */
    .blueprint-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .blueprint-text {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.7;
      font-family: "Noto Sans JP", sans-serif;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: 24px 16px;
        padding-top: 40px;
      }

      .header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .header-name {
        font-size: 22px;
      }

      .pillars-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .domains-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .monthly-score {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="hero-stripe"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-label">Self Insight</div>
      <div class="header-name">手嶋静</div>
      <div class="header-date">2026年5月</div>
    </div>

    <!-- Search aesthetic -->
    <div class="search-aesthetic">
      壬水 × 二黒土星 — 大地に宿る、深く静かな水
    </div>

    <!-- Four pillars -->
    <div class="section-header">四柱推命</div>
    <div class="pillars-grid">
      <div class="pillar-card">
        <div class="pillar-label">年柱</div>
        <div class="pillar-chars">丁巳</div>
        <div class="pillar-role">偏財</div>
      </div>
      <div class="pillar-card">
        <div class="pillar-label">月柱</div>
        <div class="pillar-chars">甲子</div>
        <div class="pillar-role">比肩</div>
      </div>
      <div class="pillar-card">
        <div class="pillar-label">日柱（日主）</div>
        <div class="pillar-chars">壬辰</div>
        <div class="pillar-role">—</div>
      </div>
      <div class="pillar-card">
        <div class="pillar-label">時柱</div>
        <div class="pillar-chars">庚申</div>
        <div class="pillar-role">偏印</div>
      </div>
    </div>

    <!-- Five elements -->
    <div class="section-header">五行バランス</div>
    <div class="five-elements">
      <div class="element-row">
        <div class="element-label">木</div>
        <div class="element-bar-container">
          <div class="element-bar" style="width: 30%;"></div>
        </div>
        <div class="element-percent">30%</div>
      </div>
      <div class="element-row">
        <div class="element-label">火</div>
        <div class="element-bar-container">
          <div class="element-bar fire" style="width: 0%;"></div>
        </div>
        <div class="element-percent">0%</div>
        <div class="deficient-chip">欠</div>
      </div>
      <div class="element-row">
        <div class="element-label">土</div>
        <div class="element-bar-container">
          <div class="element-bar" style="width: 35%;"></div>
        </div>
        <div class="element-percent">35%</div>
      </div>
      <div class="element-row">
        <div class="element-label">金</div>
        <div class="element-bar-container">
          <div class="element-bar" style="width: 25%;"></div>
        </div>
        <div class="element-percent">25%</div>
      </div>
      <div class="element-row">
        <div class="element-label">水</div>
        <div class="element-bar-container">
          <div class="element-bar" style="width: 10%;"></div>
        </div>
        <div class="element-percent">10%</div>
      </div>
    </div>

    <!-- Domains -->
    <div class="section-header">運気スコア</div>
    <div class="domains-grid">
      <div class="domain-tile">
        <div class="domain-score">78</div>
        <div class="domain-label">仕事</div>
      </div>
      <div class="domain-tile">
        <div class="domain-score">82</div>
        <div class="domain-label">恋愛</div>
      </div>
      <div class="domain-tile">
        <div class="domain-score">65</div>
        <div class="domain-label">財運</div>
      </div>
      <div class="domain-tile">
        <div class="domain-score">88</div>
        <div class="domain-label">健康</div>
      </div>
      <div class="domain-tile">
        <div class="domain-score">71</div>
        <div class="domain-label">家庭</div>
      </div>
      <div class="domain-tile">
        <div class="domain-score">85</div>
        <div class="domain-label">精神</div>
      </div>
    </div>

    <!-- Annual fortune chart -->
    <div class="section-header">年間運気推移（2024–2032）</div>
    <div class="chart-container">
      <div class="chart-wrapper">
        <canvas id="annualChart"></canvas>
      </div>
    </div>

    <!-- Monthly fortune -->
    <div class="section-header">2026年5月の運気</div>
    <div class="monthly-card">
      <div class="monthly-score">
        <div class="monthly-number">84</div>
        <div class="monthly-label">月間スコア</div>
      </div>
      <div class="monthly-description">
        創造性と直感が最高潮。新しいプロジェクト開始の吉。
      </div>
    </div>

    <!-- Blueprint advice -->
    <div class="section-header">人生の設計図</div>
    <div class="blueprint-card">
      <div class="blueprint-text">
        壬水の流れを途切れさせない — 交流と動きが鍵。
      </div>
    </div>
  </div>

  <script>
    // Annual fortune chart
    const ctx = document.getElementById('annualChart').getContext('2d');
    const annualChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['2024', '2025', '2026', '2027', '2028', '2029', '2030', '2031', '2032'],
        datasets: [
          {
            label: '九星気学',
            data: [75, 100, 90, 80, 40, 70, 30, 45, 65],
            borderColor: '#8B5CF6',
            backgroundColor: 'rgba(139, 92, 246, 0.1)',
            tension: 0.4,
            fill: true,
            pointRadius: 5,
            pointBackgroundColor: '#8B5CF6',
            pointBorderColor: '#1A1626',
            pointBorderWidth: 2,
            borderWidth: 2,
          },
          {
            label: '六星占術',
            data: [80, 35, 90, 25, 70, 85, 95, 15, 10],
            borderColor: '#14b8a6',
            backgroundColor: 'rgba(20, 184, 166, 0.05)',
            tension: 0.4,
            fill: true,
            pointRadius: 5,
            pointBackgroundColor: '#14b8a6',
            pointBorderColor: '#1A1626',
            pointBorderWidth: 2,
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: {
              color: '#A89EC0',
              font: {
                size: 12,
                family: "'Inter', sans-serif",
              },
              usePointStyle: true,
              padding: 16,
            },
          },
          filler: {
            propagate: true,
          },
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            grid: {
              color: '#2E2545',
              drawBorder: false,
            },
            ticks: {
              color: '#6B6285',
              font: {
                size: 11,
              },
            },
          },
          x: {
            grid: {
              display: false,
              drawBorder: false,
            },
            ticks: {
              color: '#6B6285',
              font: {
                size: 11,
              },
            },
          },
        },
      },
    });
  </script>
</body>
</html>
