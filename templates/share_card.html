<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>self-insight — share card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:            #0D0B14;
      --surface:       #1A1626;
      --gold:          #C9A84C;
      --accent:        #8B5CF6;
      --text-primary:  #F5F0E8;
      --text-secondary:#A89EC0;
      --text-muted:    #6B6285;
    }

    html, body { width: 1080px; height: 1080px; }

    body {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 720px 520px at 50% 30%, rgba(139,92,246,0.16), transparent 60%),
        radial-gradient(ellipse 620px 380px at 50% 97%, rgba(201,168,76,0.06), transparent 62%),
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.35) 100%);
    }

    .frame {
      position: absolute; inset: 46px;
      border: 1px solid rgba(201,168,76,0.16);
    }

    .card {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 104px 92px 88px;
      text-align: center;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(201,168,76,0.85);
      padding-left: 0.42em;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 34px; height: 1px;
      background: rgba(201,168,76,0.5);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      min-height: 0;
    }

    .archetype-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 62px;
      line-height: 1.12;
      color: var(--gold);
      letter-spacing: 0.01em;
    }

    .archetype-ja {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 84px;
      line-height: 1.32;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      max-width: 860px;
      margin-top: 26px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .archetype-ja.is-long {
      font-size: 68px;
    }

    .ornament {
      font-size: 26px;
      color: var(--gold);
      opacity: 0.85;
      margin: 52px 0 46px;
      line-height: 1;
    }

    .tagline {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: 34px;
      line-height: 1.95;
      letter-spacing: 0.045em;
      color: var(--text-primary);
      max-width: 720px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 25px;
      letter-spacing: 0.14em;
      color: var(--gold);
    }
    .brand-mark::first-letter { text-transform: lowercase; }
    .brand-sub {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="frame"></div>

  <div class="card">
    <div class="eyebrow">Archetype</div>

    <div class="hero">
      <div class="archetype-en">{{ archetype_en }}</div>
      <div class="archetype-ja{% if archetype_ja|length > 8 %} is-long{% endif %}">{{ archetype_ja }}</div>
      <div class="ornament">&#10022;</div>
      <div class="tagline">{{ share_tagline }}</div>
    </div>

    <div class="brand">
      <div class="brand-mark">self-insight</div>
      <div class="brand-sub">生年月日が明かす、あなたの核。</div>
    </div>
  </div>
</body>
</html>
