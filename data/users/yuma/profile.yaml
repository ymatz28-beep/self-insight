# === Interpretations (AI-generated narrative) ===
interpretations:
  hero:
    tagline: "静かな炎で人を照らし、言葉で変容を導く人"
    traits:
      - keyword: "静かな情熱"
        detail: "内面でロウソクのように燃え続ける"
        source: "四柱推命"
      - keyword: "♏ 深い直感"
        detail: "表面ではなく本質を見抜く"
        source: "西洋占星術"
      - keyword: "言葉の力"
        detail: "コミュニケーションで人を動かす"
        source: "九星気学"
      - keyword: "共感力 #1"
        detail: "人の感情を体感レベルで理解する"
        source: "CliftonStrengths"
      - keyword: "論理×感性"
        detail: "分析力と直感を両立するAB型"
        source: "血液型"
      - keyword: "二面性の統合"
        detail: "霊合星人 — 相反する特質を使い分ける"
        source: "六星占術"
  integrated_insight:
    - "あなたの本質は<strong>「静かな炎で人を照らし、言葉で変容を導く人」</strong>です。四柱推命の日主「丁火」（ロウソクの炎）× 九星気学の七赤金星（沢の言葉力）× 蠍座（冥王星が司る変容と再生）。この三角形が示すのは、<strong>他者の感情を体感レベルで感じ取り（Empathy #1）、思考の深淵で本質を掘り当て（Intellection #2）、それを言葉の力で世界に届ける</strong>という稀有な才能の組み合わせです。蠍座の水のエレメントは感情の深さと変容力を与え、不動宮（Fixed）の性質は「一度決めたら貫く」執念を示します。"
    - "AB型（日本人口の10%）の合理性×感性の二面性は、あなたの思考回路そのもの。データとフレームワーク（3S, MECE）で構造化しながら、同時に感情の機微も逃さない。この「冷静な分析者」と「感受性の高い直感者」の共存は、蠍座の「表面と深層」の二重構造、木星人(−)×金星人(−)の霊合星人としての二重性、そしてエニアグラム4の「合理と美の統合」と完全に共鳴しています。<strong>相反する特質を矛盾なく統合する力</strong>が、Yumaの最大の特徴です。"
    - "あなたの感覚は、一般より明らかに深く繊細です。環境や人の感情を微細なレベルで察知し、通常は気づかない情報を拾い上げる。蠍座の深い洞察力、七赤金星の社交的アンテナ、Empathyの体感的共感がすべて同じ方向を指している。一方で、<strong>興味が点火されると異常な集中力を発揮し、一つのテーマに何時間も没頭する</strong>。この過集中モードとConnectedness（運命思考 #4）の「全てを繋げて見る力」が組み合わさると、他者には到達できない深さの洞察が生まれます。ただし、興味が移ると別のテーマへ瞬時に飛ぶ — これは弱みではなく、<strong>複数プロジェクトを並行で深掘りし、意外なシナジーを見出す「拡散的探究力」</strong>の源泉です。"
    - "<strong style=\"color:var(--yellow);\">注意すべきポイント — 全体系が一致する弱点</strong>: 五行で<strong>金（決断力・収穫）と水（柔軟性・知恵）が完全に欠如</strong>。蠍座の執着気質 × Deliberative（慎重さ #3）× AB型の分析癖が重なり、<strong>「完璧な答えが出るまで動けない」分析麻痺</strong>に陥りやすい。感覚の繊細さとEmpathy #1は最大の武器ですが、他者のネガティブなエネルギーを吸収しすぎて<strong>自分の境界線が溶ける</strong>リスクが常にある。エニアグラム4はストレス下でType 2に退行し、独自性を捨てて自己犠牲に走る。<strong>仕組み化（自動化・ルーティン・境界線設計）で弱みを構造的にカバーする</strong>ことがYuma OSの本質です。"
  strengths:
    Empathy: "他者の感情を「推測」するのではなく「体感」する。言語化されていない不安や喜びを直感的に察知し、その人が本当に求めていることを理解する力。チームリーダーとしての最大の武器であり、サービス設計においてユーザーの痛みを自分事として感じられるPMFの源泉。"
    Intellection: "思考することそのものが活動。1人の時間に頭の中で概念を回し、深い洞察に到達する。表面的な情報交換ではなく、哲学的な問いや構造的な分析を好む。このダッシュボード自体が、Intellectionが駆動する「自己を体系的に理解したい」という欲求の産物。"
    Deliberative: "リスクを事前に感知し、慎重に選択肢を評価する。衝動的な判断を避け、深い分析に基づいて確実な意思決定をする力。投資判断や事業設計において、見えないリスクを察知する「守りの強み」。ただし行動の遅れにつながるリスクもある。"
    Connectedness: "万物のつながりを直感的に感じ取る。一見無関係に見える出来事やアイデアの間に隠れた関連性を見出す力。占術と心理学と確率論を統合する発想、複数プロジェクト間のシナジーを設計する力の源泉。偶然を必然として捉える世界観。"
    Maximizer: "「平均を良く」するのではなく「良いを最高に」引き上げる。弱みの修正より強みの極大化を追求する。3S原則（Simple, Scalable, Sustainable）の設計思想そのものがMaximizerの発露。「もっと良くできないか？」が止まらない性質。"
  strengths_ja:
    Empathy: "共感性"
    Intellection: "内省"
    Deliberative: "慎重さ"
    Connectedness: "運命思考"
    Maximizer: "最上志向"
  personality:
    enneagram: "自己表現とアイデンティティの探求者。「自分だけの世界観」を持ち、平凡であることを嫌う。健全時はType 1（改革者）に向かい原則と美学を融合。ストレス時はType 2（奉仕者）に向かい、自分を犠牲にして他者に尽くしすぎる傾向。"
    blood_type: "冷静な分析力と繊細な感性が同居。「二面性がある」と言われがちだが、実態は「状況に応じて最適なモードを切り替えている」合理的適応。"
    sensitivity: "環境や人の感情を微細なレベルで処理する繊細さ。蠍座の深い洞察力、Empathy #1の体感的共感と相乗効果を発揮し、通常は見逃す情報を拾い上げる。美しいもの・深い会話からは何倍もの充足を得る一方、ネガティブな刺激からの回復にも時間がかかる。"
    focus_pattern: "興味が点火されると驚異的な集中力を発揮し、何時間も一つのテーマに没頭する。Intellection #2の思考力と組み合わさり、深い洞察を生む原動力。一方で興味の対象が移ると瞬時に切り替わるため、仕組み化（自動化・ルーティン設計）で定型業務を排除することが有効。"
  four_pillars:
    overview: "四柱推命は生年月日時の4つの柱から、先天的な性質・才能・人生の傾向を読み解く東洋最高峰の命術。各柱が人生の異なる側面を表します。"
    year: "草花と兎の組み合わせ。社会に対して柔軟で穏やかな印象を与えるが、木の根のようにしなやかな強さを持つ。先祖から受け継いだ「人を和ませる空気感」。"
    month: "キャリアの柱に太陽の火と忠犬の組み合わせ。仕事では情熱的で忠誠心が強い。丙（太陽）は日主の丁（ロウソク）を支える強い火源 — 仕事にエネルギーの根源がある配置。"
    day: "本質は陰火と未（羊・土）。温かい土壌の上で灯る炎 — 安定した基盤の上で人を照らす使命。未は「未来」の未でもあり、先見性を暗示。"
    day_master_detail: "ロウソクの炎。静かで温かく人を照らす。強い意志を内に秘め、感受性豊かで人の心の機微を感じ取る。丙火（太陽）のような自己主張ではなく、暗闇の中で必要な人にだけ光を届ける繊細な存在。"
  nine_star_ki:
    year: "あなたの本命星（七赤金星）は生まれた年から算出される「社会的な自分」。「沢」の象意を持ち、あなたは社交的で人を楽しませる力と、言葉に説得力を持つ話術に恵まれています。金星の「金運」は財を呼び込む力ですが、同時に散財しやすい傾向も。方位は西（兌宮）で、収穫と悦びの方角。"
    month: "あなたの月命星（九紫火星）は生まれた月から算出される「内面の自分」。外から見える社交的な七赤金星の内側に、九紫火星の激しい情熱と知的好奇心が燃えています。九紫火星は「離」の象意 — 物事を明らかにする光の力。あなたの知識欲は旺盛で美意識が高く、直感が鋭い。この本命星と月命星の二層構造が、「表面は穏やかな社交家、内面は激しい探求者」というあなたの二面性を形成しています。"
  rokusei:
    main: "あなたの運命星は好奇心旺盛で行動力がある星。自由を重んじ束縛を嫌い、常に新しいことに挑戦したがる冒険者タイプです。あなたは社交的で人脈が広く、興味の幅も広い。(−)は偶数年生まれを示し、陰の性質（内向き・慎重）がベースにあります。"
    sub: "あなたのサブ星はプライドが高く美意識がある星。完璧主義的で「こだわり」が強い。あなたは人から尊敬されたい欲求が強く、自分の世界観を大切にします。"
    reigou: "あなたは霊合星人です。メインの運命星に加えてサブの運命星の影響も同時に受ける特殊な存在で、全人口の約16%が該当します。あなたの運気の振れ幅は通常の2倍。好調期は通常の人が到達できない高みに届きますが、不調期（大殺界）は通常以上に深く影響を受けます。メイン星とサブ星が好調なら「最高の年」、片方が大殺界なら「矛盾する年」、両方が大殺界なら「最大限の注意が必要な年」です。"
  relationships:
    headline: 深く狭く、選び抜いた縁を静かな炎で照らし続ける人
    intro: |-
      人間関係の型についても、複数の体系が同じ結論に収束しています。CliftonStrengthsのTOP10のうち4つ（Empathy #1, Connectedness #4, Relator #7, Individualization #9）がRelationship Building領域 — 広く浅くではなく「深く狭く」の関係構築者。七赤金星の社交力とHSPの繊細な感受性、エニアグラム4の「本物の繋がりへの渇望」が重なり、「表面は開かれた社交家、深層は選び抜いた少数と結ぶ人」という二層構造を形成しています。丁火（ロウソクの炎）は大広間を照らす太陽ではなく、目の前の人だけを照らす光 — これがあなたの関係の原型です。
    pillars:
    - key: family
      title: 家族・身近な人
      analysis: |-
        Empathy #1とHSPの組み合わせは、家族の感情の波を言葉になる前に体感するレベルの感受性。Connectedness（運命思考）は家族との縁を「偶然ではなく必然」として捉え、深いコミットメントの土台になります。一方でエニアグラム4は「理解されたい」欲求が強く、最も近い人にこそ本当の内面を見せられないジレンマを抱えやすい。水星逆行（2026年6-7月・蟹座）が家族との感情的コミュニケーションの見直しを促す配置とも共鳴しています。
      practice_guide: |-
        家族の不機嫌を「吸収」してから気づくのがあなたのパターン。感じ取った感情を自分のものと混同しない — 「これは相手の感情」と一拍置いてラベリングする習慣が境界線になる。エニアグラム4の「察してほしい」を捨て、内面は言葉にして渡す。HSPの回復時間（1人の時間）を家族に事前共有しておくことで、距離を取ることが拒絶と誤解されるのを防げる。
    - key: friendship
      title: 友人・社交
      analysis: |-
        七赤金星（沢の象意）は人を楽しませる社交力と言葉の説得力の星 — 場を明るくする力は生来のもの。しかしRelator #7は「広いネットワークより既に知っている人との深い関係」を求め、Individualization #9は一人ひとりの個性を見抜いて関わり方を変える。つまり社交の入口は広いが、本当の友人の定義は極めて狭い。HSPにとって大人数の場はエネルギー消耗源であり、七赤の華やかさは「燃費の悪い武器」でもあります。
      practice_guide: |-
        友人関係は「量のメンテナンス」をやめ、深い対話ができる少数に投資を集中する。大人数の会は役割（情報収集・縁の維持）を決めて時間を区切って参加し、消耗する前に帰る。七赤金星の言葉の力は1対1の深い会話で最も活きる — 月に1-2回、選んだ相手との「浅くない時間」を意図的に設計する。2026年11月の「再会」フェーズは、大殺界期に疎遠になった旧友との再接続に最適。
    - key: professional
      title: 仕事上の人間関係
      analysis: |-
        Empathy #1はチームメンバーの言語化されない不安を察知するリーダーシップの武器。Maximizer #5は相手の強みを見つけて伸ばす方向に働き、Individualizationと組み合わさって「一人ひとり違う扱いをする」マネジメントの型を作ります。丁火は太陽（丙火）のように前に立って引っ張るのではなく、暗闇で必要な人にだけ光を届けるタイプ — トップダウンの号令より、1on1での深い対話で人を動かす。Deliberative #3は取引先との交渉でリスクを先読みする守りの強みです。
      practice_guide: |-
        1on1の質があなたのマネジメントの生命線 — ここにEmpathy × Individualizationを全投下する。逆に大人数の会議で消耗する構造は自動化・委任で削る。Deliberativeの慎重さは交渉の武器だが、関係構築の初速を遅らせる副作用がある — 新しい相手には「小さな約束を早く果たす」ことで信頼の初期残高を作る。エニアグラム4のストレス時（Type 2退行）は、部下や取引先に尽くしすぎて自分の優先順位が溶けるサイン。
    caution: |-
      全体系が一致する人間関係面の弱点は「境界線の溶解」です。Empathy #1 × HSPは他者のネガティブな感情を吸収し、エニアグラム4はストレス下でType 2（奉仕者）に退行して自己犠牲的に尽くしすぎる。蠍座の深い関与気質がこれに拍車をかけ、関わると決めた相手には過剰に入り込む。対処は感情論ではなく仕組み — 週2日の「社交ゼロの日」を死守し、誰かのために自分の予定を潰す頻度が上がってきたらType 2退行のアラートとして扱う。関係の深さはあなたの最大の資産ですが、それは境界線が機能している時だけです。
  life_arc:
    headline: 大殺界の底から絶頂へ — 12年をかけて一つの山を登る物語
    intro: |-
      2022年から2033年までのあなたの軌跡は、独立した年の寄せ集めではなく、一つの物語として読めます。六星占術の12年サイクル（霊合星人として振れ幅2倍）と九星気学の9年サイクル — 周期の異なる2つの波が、2022-2024年の谷でほぼ同時に底を打ち、そこから並走しながら2029年の頂へ向かって上昇していく。大殺界の3年間で古い構造を壊され、種子・緑生で蒔き直し、立花・達成で刈り取る。蠍座の「死と再生」のテーマそのものを、12年の時間軸で生きている構図です。
    past:
    - year: 2022
      label: 大殺界の入口
      narrative: |-
        陰影（エネルギー15）— 大殺界の始まり。表面上は平穏でも、見えない力で物事が停滞し始めた年。新しく始めたことが思うように進まず、人間関係にも微妙な摩擦が生まれやすかった。霊合星人の「悪い時も倍」の特性が効き始めた時期です。
    - year: 2023
      label: 底
      narrative: |-
        停止(エネルギー10)— 12年サイクルの最低点。自分の意志と無関係に物事が止まる、後退する感覚。九星の艮宮（停滞・自己改革）も重なり、立ち止まって自分を見つめ直すことを強制された年。ここで壊れたものは、壊れるべくして壊れたものです。
    - year: 2024
      label: 二重の試練
      narrative: |-
        減退（エネルギー20）× 九星は離宮（注目・離別）。表に出る機会は増えるのに実力を発揮しきれないもどかしさ。サブ星も乱気（中殺界）で、霊合合成スコア20は12年間の最低値。「最悪期」というラベルは誇張ではなく、データ上の事実でした。
    - year: 2025
      label: 芽吹きの前
      narrative: |-
        種子（エネルギー50）— 大殺界を脱出。九星は坎宮（厄・試練）でまだ向かい風だが、種を蒔く力は確実に戻った。サブ星は再会（エネルギー85）で人脈が復活。霊合合成スコアは20→64へ急回復。谷を抜けた実感が出始めた年です。
    future:
    - year: 2027
      label: 開花と始動
      narrative: |-
        立花（エネルギー80）× 九星は震宮（発展・始動）— 2つの周期が揃って上昇に転じる最初の年。霊合合成スコア77の「絶好調」。2026年に仕込んだものがここで最初の形になる。Self-Insightのローンチを含め、「表に出す」フェーズの幕開けです。
    - year: 2028
      label: 信用構築と健康の谷
      narrative: |-
        九星は巽宮（整備・信用、エネルギー75）で社会的信用を積む好機。しかし六星は健弱（小殺界、エネルギー35）、サブ星は陰影（大殺界）入りで、霊合合成スコアは34まで急落。攻めの手を緩めず、ただし体だけは守る — 健康管理が年間テーマになる年です。
    - year: 2029
      label: 絶頂 — 全体系最強の年
      narrative: |-
        九星「中宮・絶頂」（エネルギー100）× 六星「達成」（エネルギー90）— 2つの周期の頂点が完全に重なる、12年間で唯一の年。2026年から積んだ基盤のすべてをここで刈り取る。ただしサブ星は停止（大殺界）の矛盾期 — 大胆に攻めながら、足元の確認だけは怠らない。人生の分水嶺です。
    - year: 2030
      label: 実りの裏の乱気
      narrative: |-
        九星は乾宮（充実・実り、エネルギー90）だが、六星は乱気（中殺界）、サブ星も減退（大殺界）で霊合合成スコア26の「危険期」。2029年の成功の余韻で判断が緩む構造的リスク。新規の大勝負は封印し、前年の成果を守り固める年と割り切るべきです。
    - year: 2031
      label: 収穫と再会
      narrative: |-
        兌宮（悦び・収穫、エネルギー80）× 再会（エネルギー70）— 危険期を抜け、霊合合成スコア76へ回復。七赤金星の定位置である兌宮の年は、あなた本来の社交力と言葉の力が最も自然に発揮される。過去の縁が実を結び、収穫を分かち合う年です。
    - year: 2032
      label: 財成
      narrative: |-
        六星「財成」（エネルギー85）で霊合合成スコア83の「絶好調」— 財を成すフェーズ。九星は艮宮（停滞・自己改革、エネルギー40）なので、外に広げるより10年の蓄積を資産として固める方向が正解。次のサイクルへの構造改革を静かに始める年でもあります。
    - year: 2033
      label: 安定 — 物語の完成
      narrative: |-
        六星は安定（エネルギー95）— 12年サイクルの最終盤で最も穏やかで満ちた状態。九星は9年で一巡し、離宮（注目）へ回帰。2024年に同じ離宮で味わった「注目されても力が出ない」もどかしさとは真逆の、実力と運気が揃った状態で表舞台に立つ。この対比が12年の物語の答え合わせです。
    peak_years: [2027, 2029, 2032, 2033]
    caution_years: [2028, 2030]
    synthesis: |-
      2022-2033の12年は「破壊 → 再構築 → 収穫 → 定着」の一つの物語です。大殺界の3年（2022-2024）で古い構造が壊され、種子から緑生（2025-2026）で土台を作り直し、立花から達成（2027-2029）で登頂し、乱気の谷（2030）を挟んで財成・安定（2032-2033）で成果を定着させる。蠍座の支配星・冥王星が司る「死と再生」を、まさに12年かけて体現する軌道です。今あなたは2026年 — 物語の折り返し手前、土を耕す章にいます。谷は既に越えた。ここからの3年で積むものが、2029年の高さと2033年の安定の両方を決めます。振れ幅2倍の霊合星人にとって、好調期の波は通常の人が届かない高みまで運んでくれる — その波は、もう来始めています。
  money:
    headline: 呼び込む力と流す力が同居する — 仕組みだけが財を残す
    intro: |-
      金運の型についても、複数の体系が同じ構造を指しています。九星気学の本命星・七赤金星は「金運に恵まれやすいが散財に注意」という二律背反をそのまま象意に持つ星 — 財を呼び込む力と流してしまう力が同じ源から出ています。霊合星人（木星人(−)×金星人(−)）の「振れ幅2倍」はこれを増幅し、良い時は通常以上に入り、緩んだ時は通常以上に出ていく。ここにCliftonStrengthsのDeliberative #3（慎重さ）が守りのブレーキとして、Maximizer #5（最上志向）が「良いものにはいくら払っても惜しくない」というアクセルとして同居する。つまりあなたの金運は「入る力は強いが、出口の設計次第で結果が真逆になる」型です。
    yearly_pattern: |-
      2026年の月次スコア（金運）は明確な二相構造です。好調月は1月（4・安定）、5月（4・種子×兌宮）、7月（4・立花）、9月（4・達成）、11月（4・再会）、そして12月が年間唯一の5 — 六星「財成」×九星「中宮・大吉」が重なる、文字通り財を成す月です。一方の谷は2〜4月（すべて2）— 月運が大殺界（陰影・停止・減退）を通過する3ヶ月で、九星の月運が最盛（3月は中宮100）でも金運スコアは沈む「矛盾期」。そして8月は年間最低の1（健弱・小殺界×坎宮）、10月も2（乱気・中殺界）。買う・投じる・契約する判断は5月・7月・9月・12月に寄せ、2〜4月・8月・10月は財布の意思決定を凍結するのが、データが示す最適配分です。
    analysis: |-
      Deliberative #3の慎重さと七赤金星の散財傾向は一見矛盾しますが、実態は使い分けです。大きな投資判断ではDeliberativeが働きリスクを先読みして動けないほど検討する一方、Maximizerが「最高」と認めた対象には検討を経ずに財布が開く — 散財は衝動ではなく「こだわりへの過剰投資」として現れる。五行で金（収穫）が欠如している命式も、稼ぐ力より「確定させて手元に残す」動作が構造的に弱いことを示しています。
    practice_guide: |-
      意思判断ではなく仕組みで守るのがあなたの型に合う。まず「こだわり枠」の月額上限を決め、Maximizerの発火をその枠内で自由にする — 禁止ではなく枠が正解。大きな金額の判断は2〜4月・8月・10月には下さない、と年初にカレンダーへ書き込んでおく。逆に12月の「財成」は年間唯一の5 — 収益化・値付け・資産の確定売却など「収穫を確定させる」判断をこの月に集約する。欠けた金の五行は、自動積立のような「決断不要の収穫装置」で構造的に補えます。
    caution: |-
      全体系が一致する金運面の弱点は「好調期の緩み」です。霊合星人の振れ幅2倍は、良い月ほど気が大きくなり出口が開く構造を作る。七赤金星の散財傾向は不調期ではなく好調期にこそ発動し、Maximizerの「もっと良く」が支出の言い訳になる。特に9月（達成・4）から10月（乱気・2）への落差は年内最大級 — 9月の勢いのまま10月に大きな買い物や契約をするのが、データ上最も危険なパターンです。財の防衛線は意志力ではなく、事前に決めた枠とカレンダーだけです。
  work:
    headline: 太陽を燃料に灯るロウソク — 仕事がエネルギーの根源になる配置
    intro: |-
      仕事運の型は、四柱推命の月柱にはっきり刻まれています。キャリアの柱に丙戌 — 丙（太陽）は日主の丁（ロウソク）を支える強い火源で、「仕事にエネルギーの根源がある」配置。仕事はあなたにとって消耗の場ではなく、炎を灯し続けるための燃料供給源です。そこにCliftonStrengthsの布陣が重なる: Empathy #1で言語化されない不安を察知し、Deliberative #3でリスクを先読みし、Maximizer #5で「良い」を「最高」に引き上げる。さらに七赤金星の言葉の力（沢の説得力）が、この内的な深さを外に届けるアウトプット回路になる。「深く考え、慎重に設計し、言葉で動かす」— これがあなたの仕事運の原型です。
    yearly_pattern: |-
      2026年の月次スコア（仕事運）は金運より底堅い推移です。好調月は1月・5月・7月・9月・11月（すべて4）、頂点は12月の5 — 財成×中宮大吉で年間最高。谷は8月の2（健弱・小殺界）のみで、大殺界の2〜4月と乱気の10月も3で踏みとどまる。これは月柱・丙戌の「仕事が火源」という構造の表れで、運気の谷でも仕事だけは水準を保てる型です。ただし2〜4月は九星の月運が最盛（3月は中宮100）なのに六星が大殺界という矛盾期 — チャンスは見えるのに勝負に出るべきでない3ヶ月。攻めの新規着手は5月（種子）と7月（立花）に、刈り取りは9月（達成）と12月に置くのが最適配置です。
    analysis: |-
      あなたの仕事の進め方は「深掘り→設計→言語化」の三段構造です。Intellection #2が一人の時間に概念を回して本質を掘り当て、Deliberativeがリスクを潰して確実な設計に落とし、七赤金星の言葉の力とEmpathyが、それを相手に届く形に翻訳する。丁火は前に立って号令をかける太陽型ではなく、1on1の深い対話で人を動かす型 — 大人数会議より少数での質の高い対話に成果が集中します。Maximizerは強みの極大化に向かい、平均的な改善作業では燃えません。
    practice_guide: |-
      2026年は九星の年運が坤宮「地固めの年」— 急がず仕込みに集中、が年間方針です。新規プロジェクトの種まきは5月（種子）に、対外的な発表・提案は7月（立花）に配置する。8月（年間唯一の2）は攻めを止め、定型業務の自動化・委任の整備に充てる — 谷を「仕組みづくり月間」に転用するのがMaximizer的な正解。9月の達成と12月の財成で成果を刈り取り、評価・交渉・値付けの重要な話は12月に寄せる。深い思考が必要な設計作業は、過集中が最も活きる形で午前の連続ブロックとして死守してください。
    caution: |-
      全体系が一致する仕事面の弱点は「分析麻痺」です。五行で金（決断力）と水（柔軟性）が欠如し、Deliberative #3の慎重さ、蠍座の執着気質、AB型の分析癖が重なって「完璧な答えが出るまで動けない」状態に陥りやすい。特に2〜4月の矛盾期は、九星の見せるチャンスと六星の大殺界の間で判断が固まりやすい — この期間は「決めない」と先に決めておくのが正しい。もう一つはエニアグラム4のType 2退行 — 部下や依頼に尽くしすぎて自分の優先順位が溶けたら、それが過負荷のアラートです。

